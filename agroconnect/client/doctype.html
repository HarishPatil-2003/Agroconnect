<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                width:100px;
                height:100px;
                background:red;
                transition:10s;
                transition-timing-function:linear;
            }
            div:hover{
                width:300px;
            }
        </style>
    </head>
    <body>
        <h1>The transition-timing-function property</h1>
        <p>Hover over the div element below, to see the transition effect:
            <div></div>
        </p>
    </body>
</html>
